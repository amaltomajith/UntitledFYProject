[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compactcode"
dynamic = ["version"]
description = "CompactCode: a coding assistant orchestrated by a learned puppeteer policy (Puppeteer++), on open models"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "truststore>=0.9",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
lint = ["ruff>=0.4"]
mcp = ["mcp>=1.10"]
web = ["fastapi>=0.111.0", "uvicorn>=0.29.0", "websockets>=12.0", "psutil>=5.9", "pywinpty>=3.1; sys_platform == 'win32'",
       "ptyprocess>=0.7; sys_platform != 'win32'", "tree-sitter>=0.25", "tree-sitter-javascript>=0.25",
       "tree-sitter-typescript>=0.23"]

[project.urls]
Homepage = "https://compactcode.vercel.app"
Source = "https://github.com/amaltomajith/UntitledFYProject"

[project.scripts]
compactcode = "puppeteer_code.cli:launch"
pcode = "puppeteer_code.cli:main"

[tool.setuptools]
packages = ["puppeteer_code", "puppeteer_code.assistant", "core", "training", "extensions"]

[tool.setuptools.dynamic]
version = {attr = "puppeteer_code.__version__"}

[tool.setuptools.package-data]
# site/ is the built web app, copied in by the release build (scripts/build_release.py); not in git.
puppeteer_code = ["models.yaml", "site/**/*"]
